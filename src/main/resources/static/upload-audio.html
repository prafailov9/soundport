<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soundport · Upload</title>
  <style>
    /* Same palette as index.html */
    :root {
      --bg: #f6f5f2;
      --fg: #1d1d1f;
      --muted: #8a8a8e;
      --accent: #e5484d;
      --line: #d4d2cd;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --fg: #f2f2f2;
        --muted: #8e8e93;
        --accent: #ff5a5f;
        --line: #2c2c30;
        --card: #1a1a1d;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 100vh;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }

    .back {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: 16px;
      color: var(--muted);
      font-size: 15px;
      text-decoration: none;
    }
    .back:hover { color: var(--fg); }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .column {
      width: min(92vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* The file picker: tap to choose, or drop a file on it */
    #drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 32px 20px;
      border: 2px dashed var(--line);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #drop:hover, #drop.over { border-color: var(--accent); }
    #drop.over { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    #drop .icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      margin-bottom: 6px;
    }
    #drop .icon svg { width: 22px; height: 22px; stroke: var(--bg); }
    #file-name {
      font-size: 17px;
      word-break: break-all;
    }
    #file-meta {
      color: var(--muted);
      font-size: 14px;
    }
    #file-input { display: none; }

    #upload-btn {
      height: 52px;
      border: 0;
      border-radius: 26px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #upload-btn:disabled { opacity: 0.35; cursor: default; }

    /* Upload progress: a thin bar, hidden when idle */
    #progress {
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
      visibility: hidden;
    }
    #progress.active { visibility: visible; }
    #progress div {
      height: 100%;
      width: 0;
      background: var(--fg);
      transition: width 0.15s;
    }

    #status {
      min-height: 1.4em;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }
    #status.error { color: var(--accent); }

    /* What the server sent back, e.g. the transcript */
    #result {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    #result.shown { display: flex; }
    #result-text {
      max-height: 40vh;
      overflow-y: auto;
      font-size: 17px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    #copy-btn {
      align-self: flex-end;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Record</a>

  <h1>Upload audio</h1>

  <div class="column">
    <label id="drop" for="file-input">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M6 10l6-6 6 6M5 20h14"/>
        </svg>
      </span>
      <span id="file-name">Choose an audio file</span>
      <span id="file-meta">or drop it here</span>
    </label>
    <input type="file" id="file-input" accept="audio/*">

    <button type="button" id="upload-btn" disabled>Transcribe</button>
    <div id="progress"><div></div></div>
    <div id="status"></div>

    <div id="result">
      <div id="result-text"></div>
      <button type="button" id="copy-btn">Copy</button>
    </div>
  </div>

<script>
  const fileInput = document.getElementById("file-input");
  const drop = document.getElementById("drop");
  const fileNameEl = document.getElementById("file-name");
  const fileMetaEl = document.getElementById("file-meta");
  const uploadBtn = document.getElementById("upload-btn");
  const progressEl = document.getElementById("progress");
  const progressBar = progressEl.firstElementChild;
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const resultText = document.getElementById("result-text");
  const copyBtn = document.getElementById("copy-btn");

  const POLL_MS = 1500; // how often to ask the server how the transcription is going

  let file = null;

  // ---- choosing a file -------------------------------------------------------

  fileInput.onchange = () => choose(fileInput.files[0]);

  // Drag and drop, for the desktop
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove("over");
    choose(e.dataTransfer.files[0]);
  };

  function choose(f) {
    if (!f) return;
    file = f;
    fileNameEl.textContent = f.name;
    fileMetaEl.textContent = `${formatSize(f.size)} · ${f.type || "unknown type"}`;
    uploadBtn.disabled = false;
    setStatus("");
    resultEl.classList.remove("shown");
  }

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", isError);
  }

  // ---- uploading -------------------------------------------------------------

  uploadBtn.onclick = upload;

  function upload() {
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    // XMLHttpRequest instead of fetch: only it reports upload progress
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload-audio");

    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = pct + "%";
      setStatus(pct < 100 ? `Uploading… ${pct}%` : "Uploaded, waiting for the server…");
    };
    xhr.onload = () => {
      progressEl.classList.remove("active");
      if (xhr.status === 202) {
        // the server queued it: ask about the job until it's done
        pollJob(JSON.parse(xhr.responseText).id);
      } else {
        done();
        setStatus(`Upload failed (${xhr.status})${xhr.responseText ? ": " + xhr.responseText : ""}`, true);
      }
    };
    xhr.onerror = () => {
      done();
      setStatus("Upload failed: can't reach the server", true);
    };

    uploadBtn.disabled = true;
    resultEl.classList.remove("shown");
    progressBar.style.width = "0";
    progressEl.classList.add("active");
    setStatus("Uploading…");
    // No Content-Type header: the browser sets multipart/form-data with its boundary
    xhr.send(formData);
  }

  // ---- waiting for the transcript ----------------------------------------------

  // The button stays disabled until the job finishes, so one upload never starts two of these
  async function pollJob(id) {
    let job;
    try {
      const res = await fetch(`/jobs/${encodeURIComponent(id)}`);
      if (res.status === 404) {
        done();
        setStatus("The server lost this job (was it restarted?)", true);
        return;
      }
      job = await res.json();
    } catch {
      setStatus("Can't reach the server, still trying…");
      setTimeout(() => pollJob(id), POLL_MS);
      return;
    }

    if (job.state === "queued") {
      setStatus("Waiting for Whisper…");
    } else if (job.state === "running") {
      setStatus("Transcribing…");
    } else if (job.state === "done") {
      done();
      if (!job.text) {
        setStatus("Done, but no speech was found");
      } else {
        setStatus(job.file ? `Done ✓  Saved as ${job.file}` : "Done ✓  (the .txt couldn't be saved)");
        showResult(job.text);
      }
      return;
    } else {
      done();
      setStatus(`Transcription failed${job.error ? ": " + job.error : ""}`, true);
      return;
    }
    setTimeout(() => pollJob(id), POLL_MS);
  }

  function done() {
    uploadBtn.disabled = false;
    progressEl.classList.remove("active");
  }

  function showResult(text) {
    if (!text) return;
    resultText.textContent = text;
    resultEl.classList.add("shown");
  }

  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(resultText.textContent);
      copyBtn.textContent = "Copied ✓";
    } catch {
      copyBtn.textContent = "Can't copy";
    }
    setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
  };
</script>
</body>
</html>
